plugins {
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = mod_group
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                colonyautobridge {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://www.cursemaven.com' }
}

def minecoloniesJar = providers.environmentVariable('MINECOLONIES_JAR')
def structurizeJar = providers.environmentVariable('STRUCTURIZE_JAR')

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    if (minecoloniesJar.isPresent()) {
        File localMinecoloniesJar = file(minecoloniesJar.get())
        if (!localMinecoloniesJar.isFile()) {
            throw new GradleException("MINECOLONIES_JAR is not a readable file: ${localMinecoloniesJar}")
        }
        compileOnly files(localMinecoloniesJar)
    } else {
        compileOnly fg.deobf("curse.maven:minecolonies-245506:${minecolonies_file_id}")
    }
    if (structurizeJar.isPresent()) {
        File localStructurizeJar = file(structurizeJar.get())
        if (!localStructurizeJar.isFile()) {
            throw new GradleException("STRUCTURIZE_JAR is not a readable file: ${localStructurizeJar}")
        }
        compileOnly files(localStructurizeJar)
    } else {
        compileOnly fg.deobf("curse.maven:structurize-298744:${structurize_file_id}")
    }

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [
        minecraft_version: minecraft_version,
        forge_version: forge_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_version: mod_version
    ]
    inputs.properties properties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand properties
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    manifest {
        attributes(
            'Specification-Title': mod_name,
            'Specification-Vendor': 'Colony Autopilot',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version,
            'MixinConfigs': 'colonyautobridge.mixins.json'
        )
    }
    finalizedBy 'reobfJar'
}
