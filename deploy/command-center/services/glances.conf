# Glances 4.x rejects any request whose Host header falls outside
# webui_allowed_hosts, which defaults to localhost and the hostname only. Every
# request arriving over the Docker bridge or through Caddy carries a different
# Host and was dropped before reaching the API, so the health panel showed
# nothing while Glances itself looked perfectly healthy.
#
# There is no command-line equivalent; this is config-file only.
[outputs]
webui_allowed_hosts=localhost,127.0.0.1,172.17.0.1,172.18.0.1,192.168.1.171,homeserver
