# Phase B: media management and documentation. Same conventions as Phase A --
# loopback-bound web UIs published by Caddy, hard mem_limit on everything.
name: cc-phase-b

services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:7878:7878"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
    volumes:
      - radarr-config:/config
      - /srv/media/movies:/movies
      - /srv/media/downloads:/downloads

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:8989:8989"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
    volumes:
      - sonarr-config:/config
      - /srv/media/tv:/tv
      - /srv/media/downloads:/downloads

  # Jellyfin is intentionally absent. The host already defines one in
  # /srv/docker/docker-compose.yml with hardware transcoding via /dev/dri and a
  # 1G limit; cc-deploy starts that rather than running a competing copy.

  bookstack-db:
    image: lscr.io/linuxserver/mariadb:latest
    container_name: bookstack-db
    restart: unless-stopped
    mem_limit: 512m
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      MYSQL_ROOT_PASSWORD: ${CC_SHARED_PASSWORD:?CC_SHARED_PASSWORD is required}
      MYSQL_DATABASE: bookstackapp
      MYSQL_USER: bookstack
      MYSQL_PASSWORD: ${CC_SHARED_PASSWORD:?CC_SHARED_PASSWORD is required}
    volumes:
      - bookstack-db:/config

  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - bookstack-db
    ports:
      - "127.0.0.1:6875:80"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/New_York
      # Must be the Caddy-published port: 6875 is loopback-only, so redirects
      # built from it are unreachable from a browser.
      APP_URL: http://192.168.1.171:6876
      APP_KEY: ${BOOKSTACK_APP_KEY:?BOOKSTACK_APP_KEY is required}
      DB_HOST: bookstack-db
      DB_PORT: "3306"
      DB_USERNAME: bookstack
      DB_PASSWORD: ${CC_SHARED_PASSWORD:?CC_SHARED_PASSWORD is required}
      DB_DATABASE: bookstackapp
    volumes:
      - bookstack-config:/config

volumes:
  radarr-config:
  sonarr-config:
  bookstack-db:
  bookstack-config:
