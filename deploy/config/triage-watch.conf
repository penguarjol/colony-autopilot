# Which homeserver services wake the triage capture, and how.
#
# "onfailure" units get an OnFailure=colony-triage-capture@<unit>.service
# drop-in installed by install-triage.sh. That fires the moment systemd marks
# the unit failed.
#
# "scan" targets are polled by colony-triage-scan.timer instead. A unit that
# stays active while emitting hard errors is invisible to OnFailure=: the
# Minecraft bridge logged two errors per second for hours while its container
# reported healthy and colony-autopilot.service stayed active. Docker container
# names are accepted here as well as systemd units.

onfailure colony-agent.service
onfailure colony-agent-proxy.service
onfailure colony-agent-proxy.socket
onfailure colony-autopilot.service
onfailure ollama.service

scan colony-autopilot.service
scan colony-agent.service
scan ollama.service
scan fea5b15c-2aa0-473f-b361-3885b286cd7e

# "include <unit|*> <substring>" narrows a unit to the errors worth acting on.
# Once a unit has any include rule, only matching lines can raise an incident.
#
# A 24-hour survey of the Minecraft container found roughly 1,700 error lines,
# dominated by third-party mods: 618 from worlds_together probing Forge jars for
# a fabric.mod.json, 526 from Forge's dist cleaner refusing client-only classes
# on a dedicated server, then Origins, Apotheosis and a dozen others. None of it
# is fixable here and all of it recurs on every boot, so the unit is scoped to
# code we own plus crash-class events rather than chased with ignore rules.
include fea5b15c-2aa0-473f-b361-3885b286cd7e ColonyAutopilot
include fea5b15c-2aa0-473f-b361-3885b286cd7e Exception in thread
include fea5b15c-2aa0-473f-b361-3885b286cd7e Encountered an unexpected exception
include fea5b15c-2aa0-473f-b361-3885b286cd7e Watching Server
include fea5b15c-2aa0-473f-b361-3885b286cd7e crash report

# "ignore <unit|*> <substring>" suppresses a permanently benign error. Only add
# an entry for something that is expected, recurs on every start, and has no
# fix; anything genuinely fixable belongs in the queue instead.
